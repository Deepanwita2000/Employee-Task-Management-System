{% extends 'base.html' %}
{% load static %}
{% block title %}Create Program{% endblock %}

{% block content %}
<div class="container">
  <div class="card shadow">
    <div class="card-header bg-primary text-white">
      <h4 class="mb-0" id="event-title">Add New Task</h4>
    </div>
    <div class="card-body">

      <form id="taskForm" method="POST">
        {% csrf_token %}
        <div class="mb-3">
            <input type="hidden" id="task_id" name="task_id">
            <label for="title" class="form-label">Title</label>
            <input type="text" class="form-control" id="title" name="title" required value="Title"  onblur="validateTask()" oninput="clearError('title_error')">
            <div id="title_error"></div>
        </div>

        <div class="mb-3">
            <label for="description" class="form-label">Description</label>
            <textarea class="form-control" id="description" name="description" rows="4" required onblur="validateTask()" oninput="clearError('description_error')"></textarea>
            <div id="description_error"></div>
        </div>

        <div class="mb-3">
            <label for="status" class="form-label">Status</label>
            <select class="form-select" name="status" id="status" required>
            {% for value,stat in status %}
              <option value="{{ value }}">{{ stat }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="mb-3">
            <label for="emp_email" class="form-label">Employee Email</label>
            
            <input type="hidden" class="form-control" id="emp_id" name="emp_id" required value="@gmail.com">
            <!-- <input type="text" class="form-control" id="emp_email" name="emp_email" required value="@gmail.com" onblur="validateTask()" oninput="clearError('email_error')">
            <div id="email_error"></div> -->
                   
            <select class="form-select" id="emp_email" name="emp_email" required>
            {% for t in teams %}
              <option value="{{ t.employee.email }}">{{ t.employee.first_name }} {{ t.employee.last_name }}</option>
            {% endfor %}
          </select>
        </div>

        <div id="acknowledge" class="mt-3 fw-semibold" style="display:none;"></div>
        <button type="submit" class="btn btn-success w-100" id="task-btn" disabled>Add</button>
      </form>
    </div>
  </div>

    <h4 class="mt-5 mb-4">Tasks List</h4>
  <table class="table table-striped table-bordered">
      <thead class="table-dark">
          <tr>
              <th>ID</th>
              <th>Title</th>
              <th>Description</th>
              <th>Status</th>
              <th>Assigned to</th>
              <th>Assigned by</th>
              <th>Edit</th>
              <th>Delete</th>
              <th>Comment</th>
          </tr>
      </thead>
      <tbody id="taskList">
          {% include 'task_app/partial_task_list.html' %}
      </tbody>
  </table>


</div>

{% endblock %}
