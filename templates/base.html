{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>{% block title %}Django using AJAX{% endblock %}</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- task Ajax -->
    <script src="/static/js/ajax_script.js"></script>
     <!-- comment Ajax -->
    <script src="/static/js/comment_ajax.js"></script>
    <script src="{% static 'js/task_validation.js' %}"></script>
    <script src="{% static 'js/register_validation.js' %}"></script>
    <script src="{% static 'js/sample_account.js' %}"></script>
    <script src="{% static 'js/chatbot.js' %}"></script>
    <script src="{% static 'js/sample_task.js' %}"></script>

    <!-- css link -->
     <link rel="stylesheet" href="{% static 'css/sidebar.css' %}">
     <link rel="stylesheet" href="{% static 'css/user_profile.css' %}">
     <link rel="stylesheet" href="{% static 'css/sample_account.css' %}">
  
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        .modal-backdrop.show {
  opacity: 0.5 !important;
  z-index: 9998 !important;
}

.modal {
  z-index: 9999 !important;
}

body.modal-open {
  overflow: hidden !important;
}
        body {
            padding-top: 50px;
        }
    </style>
</head>
 <body class="{% block body_class %}{% endblock %}">

    <!-- Navbar -->
    

    {% if user.is_authenticated %}
    {% include 'other/navbar.html' %}
     {% include 'other/sidenav.html' %}
    {% endif %}
   
    
    <!-- Content -->
    {% block content %}
    <div class="container">
       

      
        <!-- <h1 class="mt-4"> <p>Welcome to the Employee Task management System.</p></h1> -->
     
    </div> 
    {% endblock %}
        <script src="/static/js/checkBox.js/"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
