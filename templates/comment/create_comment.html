{% extends 'base.html' %}
{% load static %}
{% block title %}Give Comments{% endblock %}

{% block content %}
<div class="container"> 
  <div class="card shadow">
    <div class="card-header bg-primary text-white">
      <h4 class="mb-0" id="event-title">Add Comments</h4>
    </div>
    <div class="card-body">

      <form id="taskForm" method="POST">
        {% csrf_token %}
        <div class="mb-3">
            <label for="comment" class="form-label"></label>
            <textarea class="form-control" id="comment" name="comment" rows="4" required></textarea>
        </div>
   
        <div id="acknowledge" class="mt-3 fw-semibold" style="display:none;"></div>
        <button type="submit" class="btn btn-success w-100" id="comment-btn" value="{{ id }}">Add</button>
      </form>
    </div>
  </div>


    <h4 class="mt-5 mb-4"></h4>
  <div class="card" id="comment_box">
          {% include 'comment/partial_comment.html' %}
</div>

</div>
{% endblock %}
