{% for com in comments %}
{% if user.role == 'manager' %}
  {% if com.commented_by == user %}
      <div class="card-header">
          <h5>Message</h5>
        </div>
        <div class="card-body">
          <h5 class="card-title">{{ com.comment_text }}</h5>
          <p class="card-text">{{ com.commented_at }}</p>
          <!-- <a href="#" class="btn btn-primary">edit</a> -->
      </div>
  {% endif %}
{% endif %}
<br>
{% endfor %}
