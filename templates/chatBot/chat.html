
<div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-xl">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title" id="exampleModalLabel">New message</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <div class="modal-body">
        <form method="post" id="qsForm">
        {% csrf_token %}
          <div class="mb-3">
            <label for="description">Ask Question::</label>
            <textarea type="text" class="form-control" id="question" name="question" rows="3"></textarea>
          </div>

         <br>
        <button id="chat_btn" class="btn btn-success">Search</button>
           
        </form>
      </div>
      <!-- Reply Message -->
    <hr>
    <div id="reply"></div>

    <!-- Spinner Overlay -->
        <div id="spinner-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(255,255,255,0.7); z-index:9999; text-align:center;">
        <div class="spinner-border text-primary" role="status" style="position:relative; top:40%; width: 4rem; height: 4rem;">
            <span class="visually-hidden">Loading...</span>
        </div>
        
        </div>
     </div>
  </div>
</div>
