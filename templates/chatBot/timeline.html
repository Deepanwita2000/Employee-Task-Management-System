
<div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-xl">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title" id="exampleModalLabel">Generate Timeline</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <div class="modal-body">
    
      <form id="timelineForm" method="POST">
           {% csrf_token %}

            <label>Project Description</label><br>
            <textarea id="project_description" rows="5" style="width:100%;"></textarea><br><br>
            <label>Expected Timeline</label><br>
            <input type="text" id="expected_timeline" placeholder="e.g. 6 weeks"><br><br>
            <h3>Team Members</h3>
            {% for user in users %}
                <div class="team-member"
                    data-name="{{ user.get_full_name }}"
                    data-role="{{ user.role }}"
                    data-experience="{{ user.yop }}"
                    data-domain="{{ user.designation_e }}">
                    {{ user.get_full_name }} ({{ user.designation_e }} | {{ user.yop }} yrs)
                    
                </div>
            {% endfor %}

        

            <br>
            <button type="submit" class="btn btn-dark">Generate</button>
           
        </form>
      </div>
      <!-- Reply Message -->
    <hr>
    <div id="timelineResult"></div>

    <!-- Spinner Overlay -->
        <div id="spinner-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(255,255,255,0.7); z-index:9999; text-align:center;">
        <div class="spinner-border text-primary" role="status" style="position:relative; top:40%; width: 4rem; height: 4rem;">
            <span class="visually-hidden">Loading...</span>
        </div>
        
        </div>
     </div>
  </div>
</div>
